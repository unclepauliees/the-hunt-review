<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: the-hunt-comp-ab.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Trirong:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#1e2020}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1600px">
  <figure class="r-hero-keyart region plate" data-region="hero-keyart"><img src="../../../assets/plates/hero-keyart.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-field-guide-panel region chrome" data-region="field-guide-panel"><!-- Narrow translucent dark-to-clear information panel --></div>
  <div class="r-presented-by region text" data-region="presented-by"><!-- Small tracked presentation line in originals gold --><p style="font-size:var(--r-presented-by-font);font-family:var(--r-presented-by-family),sans-serif;font-weight:var(--r-presented-by-weight);line-height:1.05;margin:0">presented-by</p></div>
  <div class="r-campaign-date region text" data-region="campaign-date"><!-- Compact tracked campaign date --><p style="font-size:var(--r-campaign-date-font);font-family:var(--r-campaign-date-family),sans-serif;font-weight:var(--r-campaign-date-weight);line-height:1.05;margin:0">campaign-date</p></div>
  <figure class="r-audio-tagline region plate" data-region="audio-tagline"><img src="../../../assets/plates/audio-tagline.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-journey-line region chrome" data-region="journey-line"><!-- Hairline joining three journey states --></div>
  <div class="r-journey-labels region text" data-region="journey-labels"><!-- Enter, Discover, Reveal labels --><p style="font-size:var(--r-journey-labels-font);line-height:1.05;margin:0">journey-labels</p></div>
  <div class="r-journey-seals region control" data-region="journey-seals"><!-- Three wax-seal journey marks with first active: rebuild the control's chrome from the crop (comp-spec.mjs --crop journey-seals); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-global-map-rail region chrome" data-region="global-map-rail"><!-- Fixed right-edge page progress line and seal marks --></div>
</main>
</body>
</html>
